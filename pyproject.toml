[project]
name = "fraud-rules-engine"
version = "0.1.0"
description = "Event-sourced, explainable risk decisioning for iGaming payments and accounts (synthetic demo)"
readme = "README.md"
authors = [
    { name = "Nikolay Chekotko", email = "170371940+nchekotko@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "uvicorn>=0.54.0",
]

license = "MIT"

[project.scripts]
fre = "fraud_rules_engine.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

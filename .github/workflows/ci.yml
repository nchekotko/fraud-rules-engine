name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Tests
        run: uv run pytest
      - name: Validate rule sets
        run: uv run fre validate rules/production.yaml rules/candidate.yaml
      - name: Smoke simulation
        run: uv run fre simulate --players 300 --out /tmp/summary.md
